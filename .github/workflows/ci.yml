name: CI

# Packages, tests, Android builds of the example app and of the Expo SDK 58 example with the 16 KB check; started
# by hand: the apps run on Android emulators and the iOS builds and simulator run.
# The packages are built once (job packages) and the exact same tarballs are used by the android, expo-android and
# ios jobs.
# iOS runs on macOS runners, which cost 10x the minutes of a private repository: it only runs when started by hand
# (Actions tab) until the repository is public.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build and run iOS (macOS runners)'
        type: boolean
        default: true
      emulators:
        description: 'Also run the Android apps on emulators (example: Android 7, 11, 16, 16 with 16 KB pages; Expo: Android 16)'
        type: boolean
        default: true

permissions:
  contents: read

# bash --noprofile --norc -eo pipefail: a failing command on the left of a pipe fails the step
defaults:
  run:
    shell: bash

# Pull requests: a new push cancels the running build. Pushes to main and manual runs are never cancelled
# (a new run waits for the current one); the event name keeps a manual run from replacing a pending push run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    runs-on: ubuntu-24.04
    # a cold OpenSSL build (4 ABIs) takes most of this; with the cache the job takes a few minutes
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Android NDK 27
        id: ndk
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "NDKs in $sdk/ndk:"; ls -1 "$sdk/ndk" 2>/dev/null || true
          # highest 27.* by revision (the glob order would put 27.10 before 27.2)
          best=""; bestkey=0; bestrev=""
          for d in "$sdk"/ndk/27.*; do
            [ -f "$d/source.properties" ] || continue
            rev=$(sed -n 's/^Pkg\.Revision *= *//p' "$d/source.properties" | tr -d '\r')
            IFS=. read -r a b c <<<"$rev"
            key=$(( ${a:-0} * 10000000000 + ${b:-0} * 100000000 + ${c:-0} ))
            if [ "$key" -gt "$bestkey" ]; then bestkey=$key; best=$d; bestrev=$rev; fi
          done
          if [ -z "$best" ]; then
            echo "::error::No Android NDK 27.* in $sdk/ndk: bridge/openssl/build-openssl.sh needs one"
            exit 1
          fi
          echo "Using NDK $bestrev ($best)"
          echo "ANDROID_NDK_ROOT=$best" >> "$GITHUB_ENV"
          echo "version=$bestrev" >> "$GITHUB_OUTPUT"
      # only the 4 built archives and the upstream 3.3.1 arm64 archive, not the 900 MB openssl-build scratch folder
      - name: OpenSSL cache
        uses: actions/cache@v6
        with:
          path: bridge/.cache/openssl
          key: openssl-${{ hashFiles('bridge/openssl/build-openssl.sh') }}-ndk-${{ steps.ndk.outputs.version }}
      # upstream tarballs and Node binaries, checksummed by the build scripts on every reuse
      - name: Upstream downloads cache
        uses: actions/cache@v6
        with:
          path: |
            bridge/.cache/*.tgz
            bridge/.cache/node
            react/.cache
          key: upstream-${{ hashFiles('bridge/build.mjs', 'react/build.mjs') }}
      - name: OpenSSL 3.5 LTS for Android (skipped per ABI when cached)
        run: bridge/openssl/build-openssl.sh
      - run: npm run build
      - name: Packages
        run: ls -l bridge/out/*.tgz react/out/*.tgz && sha256sum bridge/out/*.tgz react/out/*.tgz
      - run: npm test
      - name: Converter tests (with the afterdb package, nothing from static.realm.io)
        working-directory: converter
        run: |
          # --ignore-scripts: the lockfile's upstream realm@20.2.0 would run prebuild-install (static.realm.io).
          # Our package replaces it and ships the Node binaries.
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund realm@file:../bridge/out/pomwik-afterdb-20.3.0.tgz
          # no rebuild needed: better-sqlite3 13 has no install script and ships its binaries in prebuilds/
          name=$(node -p 'require("./node_modules/realm/package.json").name')
          [ "$name" = "@pomwik/afterdb" ] || { echo "::error::converter tests would run on $name, not @pomwik/afterdb"; exit 1; }
          npm test
      # shared with the android, expo-android and ios jobs (a cache, not an artifact: artifact storage is small on a
      # private repo)
      - name: Share the packages
        uses: actions/cache/save@v6
        with:
          path: |
            bridge/out/*.tgz
            react/out/*.tgz
          key: packages-${{ github.sha }}

  android:
    needs: packages
    runs-on: ubuntu-24.04
    # release and debug builds of the 4 ABIs
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Packages from the packages job
        uses: actions/cache/restore@v6
        with:
          path: |
            bridge/out/*.tgz
            react/out/*.tgz
          key: packages-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Packages (same SHA-256 as in the packages job)
        run: ls -l bridge/out/*.tgz react/out/*.tgz && sha256sum bridge/out/*.tgz react/out/*.tgz
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('example/android/**/*.gradle*', 'example/package.json') }}
      - name: Install the example app (realm and @realm/react aliased to the afterdb packages)
        working-directory: example
        run: npm install --no-audit --no-fund
      - name: Typecheck the example app
        working-directory: example
        run: npx tsc --noEmit
      - name: Release build, 4 ABIs
        working-directory: example/android
        run: ./gradlew assembleRelease --console=plain
      - name: OpenSSL comes from the package (same bytes, version 3.5.9), not from static.realm.io
        working-directory: example/node_modules/realm
        env:
          V: 3.5.9
        run: |
          shopt -s nullglob
          n=0
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            dirs=(binding/android/.cxx/Release/*/"$abi"/openssl-"$V")
            deps=(prebuilds/android/"$abi"/deps/openssl-"$V"-*-android.tar.gz)
            [ ${#dirs[@]} -gt 0 ] || { echo "::error::$abi: no binding/android/.cxx/Release/*/$abi/openssl-$V"; exit 1; }
            [ ${#deps[@]} -eq 1 ] || { echo "::error::$abi: expected 1 prebuilds/android/$abi/deps/openssl-$V-*-android.tar.gz, found ${#deps[@]}"; exit 1; }
            for d in "${dirs[@]}"; do
              cmp "$d/openssl.tar.gz" "${deps[0]}"
              grep -qF "OpenSSL $V" "$d/include/openssl/opensslv.h"
            done
            echo "$abi: bundled OpenSSL $V"; n=$((n+1))
          done
          [ "$n" -eq 4 ]
      - name: 16 KB page alignment of every native library
        run: node scripts/check-16kb.mjs example/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: example-release-apk
          path: example/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      # compile check only: a debug APK loads its JS from Metro, so it is not run
      - name: Debug build, 4 ABIs (compile check)
        working-directory: example/android
        run: |
          # full log in a file: on failure, print the errors and the end of the log
          if ! ./gradlew assembleDebug --console=plain > gradle-debug.log 2>&1; then
            grep -E '(error:|^e: |FAILURE|What went wrong)' gradle-debug.log | head -100 || true
            tail -80 gradle-debug.log
            exit 1
          fi
          tail -5 gradle-debug.log

  # Runs the release APK of the android job on emulators and checks the self-check screen twice
  # (AFTERDB_SELF_CHECK_OK, then launches 1 and 2 after a force-stop). Started by hand (Actions tab).
  android-run:
    if: github.event_name == 'workflow_dispatch' && inputs.emulators
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 24, target: google_apis, label: 'Android 7 (minSdk)' }
          - { api: 30, target: google_apis, label: 'Android 11' }
          - { api: 36, target: google_apis, label: 'Android 16' }
          - { api: 36, target: google_apis_ps16k, label: 'Android 16, 16 KB pages' }
    name: android-run (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: example-release-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Self-check on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-selfcheck.sh app-release.apk com.afterdbexample android-${{ matrix.api }}-${{ matrix.target }}.png
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-run-${{ matrix.api }}-${{ matrix.target }}
          path: android-*.png
          if-no-files-found: ignore
          retention-days: 7

  # Expo SDK 58 example (examples/expo-58): android/ is generated by expo prebuild. Expo turns R8 on for release
  # builds, so running this APK also checks the keep rules shipped by the package
  # (binding/android/consumer-rules.pro).
  expo-android:
    needs: packages
    runs-on: ubuntu-24.04
    # release build of 2 ABIs
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Packages from the packages job
        uses: actions/cache/restore@v6
        with:
          path: |
            bridge/out/*.tgz
            react/out/*.tgz
          key: packages-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Packages (same SHA-256 as in the packages job)
        run: ls -l bridge/out/*.tgz react/out/*.tgz && sha256sum bridge/out/*.tgz react/out/*.tgz
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-expo-${{ hashFiles('examples/expo-58/package.json', 'examples/expo-58/app.json') }}
      - name: Install the Expo app (realm and @realm/react from the afterdb packages)
        working-directory: examples/expo-58
        run: |
          npm install --no-audit --no-fund
          name=$(node -p 'require("./node_modules/realm/package.json").name')
          [ "$name" = "@pomwik/afterdb" ] || { echo "::error::realm is $name, not @pomwik/afterdb"; exit 1; }
      - name: Typecheck the Expo app
        working-directory: examples/expo-58
        run: npx tsc --noEmit
      - name: Generate android/ (expo prebuild)
        working-directory: examples/expo-58
        run: |
          npx expo prebuild --platform android --clean
          # R8 must be on, or the build no longer tests the shipped keep rules
          grep -qx 'android.enableMinifyInReleaseBuilds=true' android/gradle.properties \
            || { echo "::error::android.enableMinifyInReleaseBuilds=true not found in android/gradle.properties"; exit 1; }
      - name: Release build, arm64-v8a and x86_64 (R8 on)
        working-directory: examples/expo-58/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --console=plain
      - name: 16 KB page alignment of every native library
        run: node scripts/check-16kb.mjs examples/expo-58/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: expo58-release-apk
          path: examples/expo-58/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  # Runs the release APK of the expo-android job (R8 on) on Android 16 and checks the self-check screen twice, like
  # android-run. Started by hand (Actions tab).
  expo-android-run:
    if: github.event_name == 'workflow_dispatch' && inputs.emulators
    needs: expo-android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: expo58-release-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Self-check on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-selfcheck.sh app-release.apk com.afterdbexample.expo58 expo58-android-36.png
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expo58-android-run-36
          path: expo58-android-*.png
          if-no-files-found: ignore
          retention-days: 7

  # Xcode: exactly 26.4 (the oldest supported) without frameworks, and the newest released Xcode >= 26.4 with
  # frameworks none, static and dynamic.
  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    needs: packages
    runs-on: macos-26
    # Debug and Release simulator builds, then the device build
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { frameworks: none, xcode: '26.4' }
          - { frameworks: none, xcode: newest }
          - { frameworks: static, xcode: newest }
          - { frameworks: dynamic, xcode: newest }
    name: ios (frameworks ${{ matrix.frameworks }}, Xcode ${{ matrix.xcode }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # xcode '26.4': exactly /Applications/Xcode_26.4*.app (26.4 or a 26.4.x patch release, never a beta or RC);
      # xcode newest: the newest released Xcode 26.x >= 26.4
      - name: Xcode ${{ matrix.xcode }} (released, not beta)
        env:
          XCODE: ${{ matrix.xcode }}
        run: |
          echo "Installed:"; ls -d /Applications/Xcode*.app || true
          case "$XCODE" in
            26.4) pattern='/Applications/Xcode_26.4*.app' ;;
            newest) pattern='/Applications/Xcode_26.*.app' ;;
            *) echo "::error::unknown matrix value xcode=$XCODE"; exit 1 ;;
          esac
          best=""; bestkey=0; bestv=""
          for app in $pattern; do
            [ -d "$app" ] || continue
            case "$app" in *[Bb]eta*|*Release_Candidate*|*_RC*) continue ;; esac
            v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null) || continue
            IFS=. read -r a b c <<<"$v"
            key=$(( ${a:-0} * 10000 + ${b:-0} * 100 + ${c:-0} ))
            # 26.4: the version must be 26.4 or 26.4.x (the folder name alone could be misleading)
            if [ "$XCODE" = 26.4 ] && { [ "${a:-}" != 26 ] || [ "${b:-}" != 4 ]; }; then continue; fi
            if [ "$key" -ge 260400 ] && [ "$key" -gt "$bestkey" ]; then bestkey=$key; best=$app; bestv=$v; fi
          done
          if [ -z "$best" ]; then
            if [ "$XCODE" = 26.4 ]; then
              echo "::error::No released Xcode 26.4 on this runner (looked for $pattern, betas and RCs excluded): the 26.4 entry of the matrix cannot run"
            else
              echo "::error::No released Xcode 26.x >= 26.4 in /Applications (React Native 0.88 and the afterdb patches need it)"
            fi
            exit 1
          fi
          echo "Using Xcode $bestv ($best)"
          sudo xcode-select -s "$best"
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
      # React Native treats USE_FRAMEWORKS as set even when empty: only export it for static or dynamic
      - name: USE_FRAMEWORKS=${{ matrix.frameworks }}
        env:
          FRAMEWORKS: ${{ matrix.frameworks }}
        run: |
          case "$FRAMEWORKS" in
            static|dynamic) echo "USE_FRAMEWORKS=$FRAMEWORKS" >> "$GITHUB_ENV"; echo "USE_FRAMEWORKS=$FRAMEWORKS" ;;
            none) echo "USE_FRAMEWORKS not set" ;;
            *) echo "::error::unknown matrix value $FRAMEWORKS"; exit 1 ;;
          esac
      - name: Packages from the packages job
        uses: actions/cache/restore@v6
        with:
          path: |
            bridge/out/*.tgz
            react/out/*.tgz
          key: packages-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Packages (same SHA-256 as in the packages job)
        run: ls -l bridge/out/*.tgz react/out/*.tgz && shasum -a 256 bridge/out/*.tgz react/out/*.tgz
      - working-directory: example
        run: npm install --no-audit --no-fund
      - name: pod install
        working-directory: example/ios
        run: bundle install && bundle exec pod install
      # newest iOS runtime not newer than the selected Xcode's simulator SDK (an older Xcode may not run a later runtime)
      - name: Boot an iPhone simulator (newest iOS runtime of the selected Xcode)
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          export SDK
          echo "iphonesimulator SDK $SDK"
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, re, sys
          d = json.load(sys.stdin)["devices"]
          sdk = [int(x) for x in os.environ["SDK"].split(".")][:2]
          ver = lambda k: [int(x) for x in re.findall(r"\d+", k)]
          ios = sorted((k for k in d if "iOS" in k and ver(k)[:2] <= sdk), key=ver)
          for rt in reversed(ios):
              phones = [x for x in d[rt] if x["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"], rt, phones[0]["name"], file=sys.stderr)
                  print(phones[0]["udid"])
                  break
          ')
          [ -n "$udid" ] || { echo "::error::no iPhone simulator available"; exit 1; }
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      # Debug loads the JS from Metro: built only, not run
      - name: Simulator build (Debug)
        working-directory: example/ios
        run: |
          # full log in a file: on failure, print the errors and the end of the log
          if ! xcodebuild -workspace AfterdbExample.xcworkspace -scheme AfterdbExample -configuration Debug \
              -destination "id=$SIM_UDID" -derivedDataPath build-debug ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build \
              > xcodebuild-sim-debug.log 2>&1; then
            grep -E '(error|fatal error):|BUILD FAILED' xcodebuild-sim-debug.log | head -100 || true
            tail -80 xcodebuild-sim-debug.log
            exit 1
          fi
          tail -5 xcodebuild-sim-debug.log
      - name: Simulator build (Release)
        working-directory: example/ios
        run: |
          # full log in a file: on failure, print the errors and the end of the log
          if ! xcodebuild -workspace AfterdbExample.xcworkspace -scheme AfterdbExample -configuration Release \
              -destination "id=$SIM_UDID" -derivedDataPath build ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build \
              > xcodebuild-sim.log 2>&1; then
            grep -E '(error|fatal error):|BUILD FAILED' xcodebuild-sim.log | head -100 || true
            tail -80 xcodebuild-sim.log
            exit 1
          fi
          tail -5 xcodebuild-sim.log
      - name: Self-check on the simulator (2 launches, result read from the app's realm file)
        working-directory: example
        run: |
          bash ../scripts/ios-selfcheck.sh ios/build/Build/Products/Release-iphonesimulator/AfterdbExample.app \
            org.reactjs.native.example.AfterdbExample "$GITHUB_WORKSPACE/ios-${{ matrix.frameworks }}-xcode-${{ matrix.xcode }}.png"
      - name: Device build (Release, generic iOS device, no signing)
        working-directory: example/ios
        run: |
          if ! xcodebuild -workspace AfterdbExample.xcworkspace -scheme AfterdbExample -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
              > xcodebuild-device.log 2>&1; then
            grep -E '(error|fatal error):|BUILD FAILED' xcodebuild-device.log | head -100 || true
            tail -80 xcodebuild-device.log
            exit 1
          fi
          tail -5 xcodebuild-device.log
          app=build/Build/Products/Release-iphoneos/AfterdbExample.app
          lipo -info "$app/AfterdbExample"
          # with frameworks, the Realm binding must be embedded in the app
          find "$app" -maxdepth 2 -name '*.framework' | sed 's|.*/||' | sort | tr '\n' ' '; echo
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ matrix.frameworks }}-xcode-${{ matrix.xcode }}
          path: |
            ios-*.png
            example/ios/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 7
