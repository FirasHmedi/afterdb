name: CI

# Packages, tests, Android builds of the example app and of the Expo SDK 58 example with the 16 KB check; on pushes
# to main and by hand: the apps run on Android emulators, and the iOS builds and simulator runs (the example app on
# React Native 0.88.1, and new apps from the React Native 0.86.3 and 0.87.1 templates).
# The packages are built once (job packages) and the exact same tarballs are used by the android, expo-android, ios
# and ios-rn jobs.
# The repository is public: iOS (macOS runners) and the emulator runs also run on every push to main.
# A push or pull request that only changes Markdown files or docs/ starts nothing: start a run by hand when a release
# needs a CI run on such a commit (publish.yml checks that CI succeeded on the commit it stages).
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build and run iOS (macOS runners)'
        type: boolean
        default: true
      emulators:
        description: 'Also run the Android apps on emulators (example: Android 7, 11, 16, 16 with 16 KB pages; Expo: Android 16)'
        type: boolean
        default: true
      ios_set:
        description: 'iOS jobs: min = example none on Xcode 26.4 + dynamic on the newest Xcode, React Native 0.86.3 and 0.87.1 dynamic (4 macOS jobs); all = 8 jobs'
        type: choice
        options: [min, all]
        default: all

permissions:
  contents: read

# bash --noprofile --norc -eo pipefail: a failing command on the left of a pipe fails the step
defaults:
  run:
    shell: bash

# Pull requests: a new push cancels the running build. Pushes to main and manual runs are never cancelled
# (a new run waits for the current one); the event name keeps a manual run from replacing a pending push run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    runs-on: ubuntu-24.04
    # a cold OpenSSL build (4 ABIs) takes most of this; with the cache the job takes a few minutes
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # the NDK of the OpenSSL archive hashes pinned in bridge/openssl/build-openssl.sh, installed when missing
      - name: Android NDK (pinned for OpenSSL)
        id: ndk
        run: bash bridge/openssl/ci-ndk.sh
      # only the 4 built archives and the upstream 3.3.1 arm64 archive, not the 900 MB openssl-build scratch folder.
      # A cached archive is reused only when it matches its pinned SHA-256.
      - name: OpenSSL cache
        uses: actions/cache@v6
        with:
          path: bridge/.cache/openssl
          key: openssl-${{ hashFiles('bridge/openssl/build-openssl.sh') }}-ndk-${{ steps.ndk.outputs.version }}
      # upstream tarballs and Node binaries, checksummed by the build scripts on every reuse
      - name: Upstream downloads cache
        uses: actions/cache@v6
        with:
          path: |
            bridge/.cache/*.tgz
            bridge/.cache/node
            react/.cache
          key: upstream-${{ hashFiles('bridge/build.mjs', 'react/build.mjs') }}
      - name: OpenSSL 3.5 LTS for Android (built, or taken from the cache when it matches the pinned SHA-256)
        run: bridge/openssl/build-openssl.sh
      - run: npm run build
      - name: Packages
        run: ls -l bridge/out/*.tgz react/out/*.tgz && sha256sum bridge/out/*.tgz react/out/*.tgz
      - run: npm test
      - name: Converter tests (with the afterdb package, nothing from static.realm.io)
        working-directory: converter
        run: |
          # --ignore-scripts: the lockfile's upstream realm@20.2.0 would run prebuild-install (static.realm.io).
          # Our package replaces it and ships the Node binaries.
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund realm@file:../bridge/out/pomwik-afterdb-20.3.0.tgz
          # no rebuild needed: better-sqlite3 13 has no install script and ships its binaries in prebuilds/
          name=$(node -p 'require("./node_modules/realm/package.json").name')
          [ "$name" = "@pomwik/afterdb" ] || { echo "::error::converter tests would run on $name, not @pomwik/afterdb"; exit 1; }
          npm test
      # shared with the android, expo-android and ios jobs (a cache, not an artifact: artifact storage is limited)
      - name: Share the packages
        uses: actions/cache/save@v6
        with:
          path: |
            bridge/out/*.tgz
            react/out/*.tgz
          key: packages-${{ github.sha }}

  android:
    needs: packages
    runs-on: ubuntu-24.04
    # release and debug builds of the 4 ABIs
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Packages from the packages job
        uses: actions/cache/restore@v6
        with:
          path: |
            bridge/out/*.tgz
            react/out/*.tgz
          key: packages-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Packages (same SHA-256 as in the packages job)
        run: ls -l bridge/out/*.tgz react/out/*.tgz && sha256sum bridge/out/*.tgz react/out/*.tgz
      # Gradle caches and the Gradle distribution (a download from services.gradle.org can time out)
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('example/android/**/*.gradle*', 'example/android/gradle/wrapper/gradle-wrapper.properties', 'example/package.json') }}
      - name: Install the example app (realm and @realm/react aliased to the afterdb packages)
        working-directory: example
        run: npm install --no-audit --no-fund
      - name: Typecheck the example app
        working-directory: example
        run: npx tsc --noEmit
      - name: Release build, 4 ABIs
        working-directory: example/android
        run: ./gradlew assembleRelease --console=plain
      - name: OpenSSL comes from the package (same bytes, version 3.5.9), not from static.realm.io
        working-directory: example/node_modules/realm
        env:
          V: 3.5.9
        run: |
          shopt -s nullglob
          n=0
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            dirs=(binding/android/.cxx/Release/*/"$abi"/openssl-"$V")
            deps=(prebuilds/android/"$abi"/deps/openssl-"$V"-*-android.tar.gz)
            [ ${#dirs[@]} -gt 0 ] || { echo "::error::$abi: no binding/android/.cxx/Release/*/$abi/openssl-$V"; exit 1; }
            [ ${#deps[@]} -eq 1 ] || { echo "::error::$abi: expected 1 prebuilds/android/$abi/deps/openssl-$V-*-android.tar.gz, found ${#deps[@]}"; exit 1; }
            for d in "${dirs[@]}"; do
              cmp "$d/openssl.tar.gz" "${deps[0]}"
              grep -qF "OpenSSL $V" "$d/include/openssl/opensslv.h"
            done
            echo "$abi: bundled OpenSSL $V"; n=$((n+1))
          done
          [ "$n" -eq 4 ]
      - name: 16 KB page alignment of every native library
        run: node scripts/check-16kb.mjs example/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: example-release-apk
          path: example/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      # compile check only: a debug APK loads its JS from Metro, so it is not run
      - name: Debug build, 4 ABIs (compile check)
        working-directory: example/android
        run: |
          # full log in a file: on failure, print the errors and the end of the log
          if ! ./gradlew assembleDebug --console=plain > gradle-debug.log 2>&1; then
            grep -E '(error:|^e: |FAILURE|What went wrong)' gradle-debug.log | head -100 || true
            tail -80 gradle-debug.log
            exit 1
          fi
          tail -5 gradle-debug.log

  # Runs the release APK of the android job on emulators and checks the self-check screen twice
  # (AFTERDB_SELF_CHECK_OK, then launches 1 and 2 after a force-stop). On pushes to main and by hand (Actions tab).
  android-run:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.emulators)
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          # the old API 24 image does not boot with 4 cores / 4 GB: the defaults stay for 24 and 30
          - { api: 24, target: google_apis, label: 'Android 7 (minSdk)', cores: 2, ram: '' }
          - { api: 30, target: google_apis, label: 'Android 11', cores: 2, ram: '' }
          - { api: 36, target: google_apis, label: 'Android 16', cores: 4, ram: 4096M }
          - { api: 36, target: google_apis_ps16k, label: 'Android 16, 16 KB pages', cores: 4, ram: 4096M }
    name: android-run (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: example-release-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A GitHub-hosted emulator sometimes never finishes booting: then, and only then, one retry. The action runs the
      # script only once the emulator has booted, and the script's first line leaves a marker file. A failure without
      # the marker: the emulator did not boot, retry. A failure with the marker: the self-check failed, the job fails.
      - name: Self-check on the emulator
        id: emu1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          cores: ${{ matrix.cores }}
          ram-size: ${{ matrix.ram }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            touch emulator-booted
            bash scripts/android-selfcheck.sh app-release.apk com.afterdbexample android-${{ matrix.api }}-${{ matrix.target }}.png
      - name: Emulator booted? (a failed self-check fails the job here, without retry)
        id: boot1
        if: steps.emu1.outcome == 'failure'
        run: |
          if [ -f emulator-booted ]; then
            echo "booted=true" >> "$GITHUB_OUTPUT"
            echo "::error::the emulator booted and the self-check failed: no retry"
            exit 1
          fi
          echo "booted=false" >> "$GITHUB_OUTPUT"
          echo "the emulator did not boot: one retry"
      - name: Self-check on the emulator (retry, the emulator did not boot)
        if: steps.emu1.outcome == 'failure' && steps.boot1.outputs.booted == 'false'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          cores: ${{ matrix.cores }}
          ram-size: ${{ matrix.ram }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-selfcheck.sh app-release.apk com.afterdbexample android-${{ matrix.api }}-${{ matrix.target }}.png
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-run-${{ matrix.api }}-${{ matrix.target }}
          path: android-*.png
          if-no-files-found: ignore
          retention-days: 7

  # Expo SDK 58 example (examples/expo-58): android/ is generated by expo prebuild. Expo turns R8 on for release
  # builds, so running this APK also checks the keep rules shipped by the package
  # (binding/android/consumer-rules.pro).
  expo-android:
    needs: packages
    runs-on: ubuntu-24.04
    # release build of 2 ABIs
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Packages from the packages job
        uses: actions/cache/restore@v6
        with:
          path: |
            bridge/out/*.tgz
            react/out/*.tgz
          key: packages-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Packages (same SHA-256 as in the packages job)
        run: ls -l bridge/out/*.tgz react/out/*.tgz && sha256sum bridge/out/*.tgz react/out/*.tgz
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-expo-${{ hashFiles('examples/expo-58/package.json', 'examples/expo-58/app.json') }}
      - name: Install the Expo app (realm and @realm/react from the afterdb packages)
        working-directory: examples/expo-58
        run: |
          npm install --no-audit --no-fund
          name=$(node -p 'require("./node_modules/realm/package.json").name')
          [ "$name" = "@pomwik/afterdb" ] || { echo "::error::realm is $name, not @pomwik/afterdb"; exit 1; }
      - name: Typecheck the Expo app
        working-directory: examples/expo-58
        run: npx tsc --noEmit
      - name: Generate android/ (expo prebuild)
        working-directory: examples/expo-58
        run: |
          npx expo prebuild --platform android --clean
          # the generated Gradle wrapper waits 10 s for services.gradle.org; give it 60 s
          sed -i 's/^networkTimeout=10000$/networkTimeout=60000/' android/gradle/wrapper/gradle-wrapper.properties
          # R8 must be on, or the build no longer tests the shipped keep rules
          grep -qx 'android.enableMinifyInReleaseBuilds=true' android/gradle.properties \
            || { echo "::error::android.enableMinifyInReleaseBuilds=true not found in android/gradle.properties"; exit 1; }
      - name: Release build, arm64-v8a and x86_64 (R8 on)
        working-directory: examples/expo-58/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --console=plain
      - name: 16 KB page alignment of every native library
        run: node scripts/check-16kb.mjs examples/expo-58/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: expo58-release-apk
          path: examples/expo-58/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  # Runs the release APK of the expo-android job (R8 on) on Android 16 and checks the self-check screen twice, like
  # android-run. On pushes to main and by hand (Actions tab).
  expo-android-run:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.emulators)
    needs: expo-android
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: expo58-release-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # one retry only when the emulator did not boot (marker file written by the script's first line), as in android-run
      - name: Self-check on the emulator
        id: emu2
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            touch emulator-booted
            bash scripts/android-selfcheck.sh app-release.apk com.afterdbexample.expo58 expo58-android-36.png
      - name: Emulator booted? (a failed self-check fails the job here, without retry)
        id: boot2
        if: steps.emu2.outcome == 'failure'
        run: |
          if [ -f emulator-booted ]; then
            echo "booted=true" >> "$GITHUB_OUTPUT"
            echo "::error::the emulator booted and the self-check failed: no retry"
            exit 1
          fi
          echo "booted=false" >> "$GITHUB_OUTPUT"
          echo "the emulator did not boot: one retry"
      - name: Self-check on the emulator (retry, the emulator did not boot)
        if: steps.emu2.outcome == 'failure' && steps.boot2.outputs.booted == 'false'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-selfcheck.sh app-release.apk com.afterdbexample.expo58 expo58-android-36.png
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expo58-android-run-36
          path: expo58-android-*.png
          if-no-files-found: ignore
          retention-days: 7

  # Xcode: exactly 26.4 (the oldest supported) without frameworks, and the newest released Xcode >= 26.4 with
  # frameworks none, static and dynamic.
  ios:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ios)
    needs: packages
    runs-on: macos-26
    # Debug and Release simulator builds, then the device build
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # all (default, and on every push to main): 4 jobs. min: Xcode 26.4 without frameworks and dynamic frameworks
      # on the newest Xcode (2 jobs).
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || inputs.ios_set == 'all') && '[{"frameworks":"none","xcode":"26.4"},{"frameworks":"none","xcode":"newest"},{"frameworks":"static","xcode":"newest"},{"frameworks":"dynamic","xcode":"newest"}]' || '[{"frameworks":"none","xcode":"26.4"},{"frameworks":"dynamic","xcode":"newest"}]') }}
    name: ios (frameworks ${{ matrix.frameworks }}, Xcode ${{ matrix.xcode }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # xcode '26.4': exactly /Applications/Xcode_26.4*.app (26.4 or a 26.4.x patch release, never a beta or RC);
      # xcode newest: the newest released Xcode 26.x >= 26.4
      - name: Xcode ${{ matrix.xcode }} (released, not beta)
        env:
          XCODE: ${{ matrix.xcode }}
        run: bash scripts/ci-xcode.sh "$XCODE"
      # React Native treats USE_FRAMEWORKS as set even when empty: only export it for static or dynamic
      - name: USE_FRAMEWORKS=${{ matrix.frameworks }}
        env:
          FRAMEWORKS: ${{ matrix.frameworks }}
        run: |
          case "$FRAMEWORKS" in
            static|dynamic) echo "USE_FRAMEWORKS=$FRAMEWORKS" >> "$GITHUB_ENV"; echo "USE_FRAMEWORKS=$FRAMEWORKS" ;;
            none) echo "USE_FRAMEWORKS not set" ;;
            *) echo "::error::unknown matrix value $FRAMEWORKS"; exit 1 ;;
          esac
      - name: Packages from the packages job
        uses: actions/cache/restore@v6
        with:
          path: |
            bridge/out/*.tgz
            react/out/*.tgz
          key: packages-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Packages (same SHA-256 as in the packages job)
        run: ls -l bridge/out/*.tgz react/out/*.tgz && shasum -a 256 bridge/out/*.tgz react/out/*.tgz
      - working-directory: example
        run: npm install --no-audit --no-fund
      - name: pod install
        working-directory: example/ios
        run: bundle install && bundle exec pod install
      # newest iOS runtime not newer than the selected Xcode's simulator SDK (an older Xcode may not run a later runtime)
      - name: Boot an iPhone simulator (newest iOS runtime of the selected Xcode)
        run: bash scripts/ci-boot-simulator.sh
      # Debug loads the JS from Metro: built only, not run
      - name: Simulator build (Debug)
        working-directory: example/ios
        run: |
          # full log in a file: on failure, print the errors and the end of the log
          if ! xcodebuild -workspace AfterdbExample.xcworkspace -scheme AfterdbExample -configuration Debug \
              -destination "id=$SIM_UDID" -derivedDataPath build-debug ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build \
              > xcodebuild-sim-debug.log 2>&1; then
            grep -E '(error|fatal error):|BUILD FAILED' xcodebuild-sim-debug.log | head -100 || true
            tail -80 xcodebuild-sim-debug.log
            exit 1
          fi
          tail -5 xcodebuild-sim-debug.log
      - name: Simulator build (Release)
        working-directory: example/ios
        run: |
          # full log in a file: on failure, print the errors and the end of the log
          if ! xcodebuild -workspace AfterdbExample.xcworkspace -scheme AfterdbExample -configuration Release \
              -destination "id=$SIM_UDID" -derivedDataPath build ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build \
              > xcodebuild-sim.log 2>&1; then
            grep -E '(error|fatal error):|BUILD FAILED' xcodebuild-sim.log | head -100 || true
            tail -80 xcodebuild-sim.log
            exit 1
          fi
          tail -5 xcodebuild-sim.log
      - name: Self-check on the simulator (2 launches, result read from the app's realm file)
        working-directory: example
        run: |
          bash ../scripts/ios-selfcheck.sh ios/build/Build/Products/Release-iphonesimulator/AfterdbExample.app \
            org.reactjs.native.example.AfterdbExample "$GITHUB_WORKSPACE/ios-${{ matrix.frameworks }}-xcode-${{ matrix.xcode }}.png"
      - name: Device build (Release, generic iOS device, no signing)
        working-directory: example/ios
        run: |
          if ! xcodebuild -workspace AfterdbExample.xcworkspace -scheme AfterdbExample -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
              > xcodebuild-device.log 2>&1; then
            grep -E '(error|fatal error):|BUILD FAILED' xcodebuild-device.log | head -100 || true
            tail -80 xcodebuild-device.log
            exit 1
          fi
          tail -5 xcodebuild-device.log
          app=build/Build/Products/Release-iphoneos/AfterdbExample.app
          lipo -info "$app/AfterdbExample"
          # with frameworks, the Realm binding must be embedded in the app
          find "$app" -maxdepth 2 -name '*.framework' | sed 's|.*/||' | sort | tr '\n' ' '; echo
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ matrix.frameworks }}-xcode-${{ matrix.xcode }}
          path: |
            ios-*.png
            example/ios/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 7

  # React Native 0.86.3 and 0.87.1 on iOS: a new app from the CLI template of each version (RnApp) with the example's
  # App.tsx and schema.ts, built with frameworks (the case of realm/realm-js#7157, a link error on React Native
  # >= 0.86) on the newest released Xcode >= 26.4, and run on the simulator like the ios job.
  ios-rn:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ios)
    needs: packages
    runs-on: macos-26
    # Release simulator build, then the device build
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # dynamic frameworks; static too on pushes to main and with ios_set all
      matrix:
        rn: ['0.86.3', '0.87.1']
        frameworks: ${{ fromJSON((github.event_name == 'push' || inputs.ios_set == 'all') && '["dynamic","static"]' || '["dynamic"]') }}
    name: ios-rn (React Native ${{ matrix.rn }}, frameworks ${{ matrix.frameworks }})
    env:
      USE_FRAMEWORKS: ${{ matrix.frameworks }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Xcode newest (released, not beta)
        run: bash scripts/ci-xcode.sh newest
      - name: Packages from the packages job
        uses: actions/cache/restore@v6
        with:
          path: |
            bridge/out/*.tgz
            react/out/*.tgz
          key: packages-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Packages (same SHA-256 as in the packages job)
        run: ls -l bridge/out/*.tgz react/out/*.tgz && shasum -a 256 bridge/out/*.tgz react/out/*.tgz
      - name: New app from the React Native ${{ matrix.rn }} template, with the example's App.tsx and schema.ts
        env:
          RN: ${{ matrix.rn }}
        run: |
          # the CLI refuses dots in project names; --version picks the template of that React Native version.
          # CLI pinned: 20.2.0 was npm's latest in the green runs of 2026-11-09 (42712609349, 42716333335)
          npx --yes @react-native-community/cli@20.2.0 init RnApp --version "$RN" --skip-git-init --install-pods false --skip-install
          cp example/App.tsx example/schema.ts RnApp/
          # realm and @realm/react from the tarballs of the packages job, as in the example app
          node -e '
            const fs = require("fs");
            const file = "RnApp/package.json";
            const p = JSON.parse(fs.readFileSync(file, "utf8"));
            p.dependencies.realm = "file:../bridge/out/pomwik-afterdb-20.3.0.tgz";
            p.dependencies["@realm/react"] = "file:../react/out/pomwik-afterdb-react-0.20.1.tgz";
            fs.writeFileSync(file, JSON.stringify(p, null, 2) + "\n");
            console.log(JSON.stringify(p.dependencies, null, 2));
          '
      - name: Install the app (realm and @realm/react from the afterdb packages)
        working-directory: RnApp
        env:
          RN: ${{ matrix.rn }}
        run: |
          npm install --no-audit --no-fund
          name=$(node -p 'require("./node_modules/realm/package.json").name')
          [ "$name" = "@pomwik/afterdb" ] || { echo "::error::realm is $name, not @pomwik/afterdb"; exit 1; }
          rn=$(node -p 'require("./node_modules/react-native/package.json").version')
          [ "$rn" = "$RN" ] || { echo "::error::react-native is $rn, not $RN"; exit 1; }
          echo "realm: $name $(node -p 'require("./node_modules/realm/package.json").version'), react-native $rn"
      - name: Typecheck the app
        working-directory: RnApp
        run: npx tsc --noEmit
      - name: pod install (USE_FRAMEWORKS=${{ matrix.frameworks }})
        working-directory: RnApp/ios
        run: bundle install && bundle exec pod install
      - name: Boot an iPhone simulator (newest iOS runtime of the selected Xcode)
        run: bash scripts/ci-boot-simulator.sh
      - name: Simulator build (Release)
        working-directory: RnApp/ios
        run: |
          # full log in a file: on failure, print the errors and the end of the log
          if ! xcodebuild -workspace RnApp.xcworkspace -scheme RnApp -configuration Release \
              -destination "id=$SIM_UDID" -derivedDataPath build ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build \
              > xcodebuild-sim.log 2>&1; then
            grep -E '(error|fatal error):|BUILD FAILED' xcodebuild-sim.log | head -100 || true
            tail -80 xcodebuild-sim.log
            exit 1
          fi
          tail -5 xcodebuild-sim.log
      - name: Self-check on the simulator (2 launches, result read from the app's realm file)
        working-directory: RnApp
        env:
          SHOT: ${{ github.workspace }}/ios-rn-${{ matrix.rn }}-${{ matrix.frameworks }}.png
        run: |
          app=ios/build/Build/Products/Release-iphonesimulator/RnApp.app
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          echo "bundle id: $id"
          bash ../scripts/ios-selfcheck.sh "$app" "$id" "$SHOT"
      - name: Device build (Release, generic iOS device, no signing)
        working-directory: RnApp/ios
        run: |
          if ! xcodebuild -workspace RnApp.xcworkspace -scheme RnApp -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
              > xcodebuild-device.log 2>&1; then
            grep -E '(error|fatal error):|BUILD FAILED' xcodebuild-device.log | head -100 || true
            tail -80 xcodebuild-device.log
            exit 1
          fi
          tail -5 xcodebuild-device.log
          app=build/Build/Products/Release-iphoneos/RnApp.app
          lipo -info "$app/RnApp"
          find "$app" -maxdepth 2 -name '*.framework' | sed 's|.*/||' | sort | tr '\n' ' '; echo
          # with dynamic frameworks, the Realm binding must be embedded in the app
          if [ "$USE_FRAMEWORKS" = dynamic ] && [ ! -d "$app/Frameworks/RealmJS.framework" ]; then
            echo "::error::RealmJS.framework is not embedded in $app"; exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-rn-${{ matrix.rn }}-${{ matrix.frameworks }}
          path: |
            ios-rn-*.png
            RnApp/ios/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 7
