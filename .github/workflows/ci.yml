name: CI

# Packages, tests, Android build of the example app with the 16 KB check, and the iOS build.
# iOS runs on macOS runners, which cost 10x the minutes of a private repository: it only runs when started by hand
# (Actions tab) until the repository is public.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build iOS (macOS runners)'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            bridge/.cache
            react/.cache
          key: upstream-${{ hashFiles('bridge/build.mjs', 'react/build.mjs', 'bridge/openssl/build-openssl.sh') }}
      - name: OpenSSL 3.5 LTS for Android (cached)
        run: bridge/openssl/build-openssl.sh
      - run: npm run build
      - run: npm test
      - name: Converter tests
        working-directory: converter
        run: npm ci && npm test

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            bridge/.cache
            react/.cache
          key: upstream-${{ hashFiles('bridge/build.mjs', 'react/build.mjs', 'bridge/openssl/build-openssl.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('example/android/**/*.gradle*', 'example/package.json') }}
      - name: OpenSSL 3.5 LTS for Android (cached)
        run: bridge/openssl/build-openssl.sh
      - run: npm run build
      - name: Install the example app (realm and @realm/react aliased to the keelstore packages)
        working-directory: example
        run: npm install --no-audit --no-fund
      - name: Release build, 4 ABIs
        working-directory: example/android
        run: ./gradlew assembleRelease --console=plain | tee gradle.log
      - name: Nothing downloaded from static.realm.io during the build
        working-directory: example/android
        run: |
          grep -q "Using bundled" gradle.log
          ! grep -q "Getting https://static.realm.io" gradle.log
      - name: 16 KB page alignment of every native library
        run: node scripts/check-16kb.mjs example/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: example-release-apk
          path: example/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        frameworks: ['', static, dynamic]
    name: ios (frameworks ${{ matrix.frameworks || 'none' }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Xcode 26.4 or newer
        run: |
          ls -d /Applications/Xcode_26.* || true
          XC=$(ls -d /Applications/Xcode_26.4*.app 2>/dev/null | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - uses: actions/cache@v4
        with:
          path: |
            bridge/.cache
            react/.cache
          key: upstream-${{ hashFiles('bridge/build.mjs', 'react/build.mjs', 'bridge/openssl/build-openssl.sh') }}
      - name: OpenSSL 3.5 LTS for Android (cached)
        run: bridge/openssl/build-openssl.sh
      - run: npm run build
      - working-directory: example
        run: npm install --no-audit --no-fund
      - name: pod install
        working-directory: example/ios
        env:
          USE_FRAMEWORKS: ${{ matrix.frameworks }}
        run: bundle install && bundle exec pod install
      - name: Simulator build (Debug)
        working-directory: example/ios
        env:
          USE_FRAMEWORKS: ${{ matrix.frameworks }}
        run: |
          xcodebuild -workspace KeelExample.xcworkspace -scheme KeelExample -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
