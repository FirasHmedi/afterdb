name: OpenSSL watch

# Fails when an OpenSSL 3.5.x release newer than the one in the Android archives exists (OPENSSL in bridge/build.mjs,
# built by bridge/openssl/build-openssl.sh). Releases are read from the GitHub API (openssl/openssl releases).
# Weekly, by hand, and on pull requests that change this file. It opens no issue: a failed run is the alert.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/openssl-watch.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  openssl-3-5:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Bundled OpenSSL vs the latest 3.5.x release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundled=$(sed -n "s/^export const OPENSSL = '\([0-9.]*\)';$/\1/p" bridge/build.mjs)
          script=$(sed -n 's/^VERSION="${1:-\([0-9.]*\)}"$/\1/p' bridge/openssl/build-openssl.sh)
          [[ "$bundled" =~ ^3\.5\.[0-9]+$ ]] || { echo "::error::OPENSSL in bridge/build.mjs is '$bundled', expected 3.5.x"; exit 1; }
          [ "$bundled" = "$script" ] || { echo "::error::bridge/build.mjs ships $bundled, build-openssl.sh builds $script"; exit 1; }
          tags=$(gh api --paginate 'repos/openssl/openssl/releases?per_page=100' \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          latest=$(sed -n 's/^openssl-\(3\.5\.[0-9][0-9]*\)$/\1/p' <<<"$tags" | sort -t. -k3,3n | tail -1)
          [ -n "$latest" ] || { echo "::error::no openssl-3.5.x release found in openssl/openssl"; exit 1; }
          echo "bundled: OpenSSL $bundled; latest 3.5.x release: $latest"
          if [ "${latest##*.}" -gt "${bundled##*.}" ]; then
            echo "::error::OpenSSL $latest is out, the Android archives ship $bundled. Update build-openssl.sh (version, source SHA-256, date, archive hashes) and OPENSSL in bridge/build.mjs."
            exit 1
          fi
          echo "OpenSSL $bundled is the latest 3.5.x release"
