name: Publish

# Stages @pomwik/afterdb and @pomwik/afterdb-react on npm with provenance, through npm trusted publishing (OIDC):
# no npm token is stored in this repository. Each package's npm settings list this repository and this workflow file
# (publish.yml) as its trusted publisher, allowed to run `npm stage publish` only. A maintainer then approves the
# staged version with 2FA (npmjs.com, Staged Packages, or `npm stage approve <id>`) before it goes live.
# Runs when a GitHub release is published, or by hand (Actions tab) with an optional dry run. A package whose
# version is already on npm is skipped, so re-running is safe.
# Before anything is staged: the CI workflow must have succeeded on the same commit with every job run (a push run,
# or a manual run with ios and emulators checked), OpenSSL is rebuilt from source without any cache (and must match
# the SHA-256 pinned in bridge/openssl/build-openssl.sh), and the SHA-256 of the 4 OpenSSL archives and of both
# tarballs are printed in the log and in the run summary.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, test and pack, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read # read the CI runs of the commit
  id-token: write # OIDC token for npm trusted publishing and provenance

defaults:
  run:
    shell: bash

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      # A push or manual CI run checks out this exact commit (a pull request run tests a merge commit instead).
      # Every job of that run must have run and passed: a manual run with ios or emulators unchecked skips jobs and
      # does not count.
      # A real run stops here when there is none; a dry run only warns, so that the rest can still be tried.
      - name: CI succeeded on this commit, every job run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | "\(.id) \(.event) \(.head_branch)"')
          found=""
          while read -r id event branch; do
            [ -n "$id" ] || continue
            url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$id ($event, $branch)"
            jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
              --jq '.jobs[] | "\(.conclusion) \(.name)"')
            if grep -qx 'success packages' <<<"$jobs" && ! grep -qv '^success ' <<<"$jobs"; then
              found="$found$url"$'\n'
            else
              echo "Not counted, a job did not run or did not pass: $url"
              grep -v '^success ' <<<"$jobs" || true
            fi
          done <<<"$runs"
          if [ -n "$found" ]; then
            echo "CI succeeded on $SHA, every job run:"; printf '%s' "$found"
            exit 0
          fi
          msg="no CI run (push, or manual with ios and emulators checked) on $SHA in which every job ran and passed: run CI on this commit (Actions, CI, Run workflow) and wait for it to pass"
          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning::$msg. Dry run: continued, a real run stops here."
          else
            echo "::error::$msg"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # exact version: trusted publishing needs npm 11.5.1 or later, `npm stage publish` 11.15.0 or later
      - name: npm 11.21.1 (trusted and staged publishing)
        run: |
          npm install -g npm@11.21.1
          [ "$(npm --version)" = "11.21.1" ] || { echo "::error::npm $(npm --version), expected 11.21.1"; exit 1; }
          npm stage --help >/dev/null
      # the NDK of the OpenSSL archive hashes pinned in bridge/openssl/build-openssl.sh, installed when missing
      - name: Android NDK (pinned for OpenSSL)
        run: bash bridge/openssl/ci-ndk.sh
      # No cache: built from the checksummed OpenSSL source in this job. The script fails if an archive differs from
      # its pinned SHA-256.
      - name: OpenSSL 3.5 LTS for Android (built from source, no cache)
        run: |
          [ ! -e bridge/.cache/openssl ] || { echo "::error::bridge/.cache/openssl exists before the build"; exit 1; }
          bridge/openssl/build-openssl.sh
      - run: npm run build
      - run: npm test
      - name: SHA-256 of the OpenSSL archives and of the packages
        run: |
          v=$(node --input-type=module -e "import { OPENSSL } from './bridge/build.mjs'; console.log(OPENSSL)")
          {
            echo "OpenSSL $v archives (built in this job):"
            (cd bridge/.cache/openssl && sha256sum openssl-"$v"-*-android.tar.gz)
            echo
            echo "Packages:"
            sha256sum bridge/out/*.tgz react/out/*.tgz
          } | tee sha256.txt
          ls -l bridge/out/*.tgz react/out/*.tgz
          # the archives shipped in the package are the ones built above
          shipped=$(tar -xzOf bridge/out/pomwik-afterdb-*.tgz package/checksums.txt | grep -c "prebuilds/android/.*/deps/openssl-$v-" || true)
          [ "$shipped" -eq 4 ] || { echo "::error::checksums.txt lists $shipped OpenSSL archives, expected 4"; exit 1; }
          for f in bridge/.cache/openssl/openssl-"$v"-*-android.tar.gz; do
            tar -xzOf bridge/out/pomwik-afterdb-*.tgz package/checksums.txt | grep -q "^$(sha256sum "$f" | cut -d' ' -f1)  " \
              || { echo "::error::$f is not the archive shipped in the package"; exit 1; }
          done
          { echo '```'; cat sha256.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Stage for approval (skips versions already on npm)
        run: |
          for tgz in react/out/*.tgz bridge/out/*.tgz; do
            name=$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')
            version=$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm: skipped"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              npm stage publish "$tgz" --access public --provenance --dry-run
            else
              # large packages: the upload of @pomwik/afterdb is about 245 MB (base64)
              npm stage publish "$tgz" --access public --provenance --fetch-timeout=3600000
              echo "$name@$version staged: approve it with 2FA on npmjs.com (Staged Packages) or with npm stage approve"
            fi
          done
