name: Upgrade

# In-place upgrade from the official realm@20.2.0 to afterdb and back, and the ABIs that ci.yml never runs.
#
# Upgrade test: the example app in upgrade mode (ENTRY_FILE=index.upgrade.js, example/upgrade/data.ts) is built
# with the official realm@20.2.0 and @realm/react@0.20.0 (A), and with afterdb (B): the packages built from this
# commit, and the packages published on npmjs.com. Same application id, same signing key. On one emulator or
# simulator: A writes a plain and an encrypted file (64-byte key) and records a SHA-256 of the content, B is
# installed over it (adb install -r, simctl install), checks every object and writes more, then A is installed
# again (adb install -r -d) and checks the objects of both.
#
# Android images and APKs (one ABI per APK):
#   x86_64 Android 16      upgrade, A and B x86_64
#   x86 Android 11         self-check of B x86; upgrade, A and B x86 (32-bit on both sides)
#   x86_64 Android 11      self-check of B armeabi-v7a through the image's ARM translation; upgrade with A x86_64
#     (ARM translation)    and B armeabi-v7a: the files written by the official x86_64 build are opened by
#                          afterdb's armeabi-v7a build, and read back by the official build.
# The official realm@20.2.0 armeabi-v7a APK cannot be A on that image: it stops at start with a SIGSEGV inside the
# translator (libndk_translation.so). A register of the crashed thread holds the return address of a sigsetjmp call
# in OpenSSL's ARM CPU feature probe in librealm.so. The job records that crash with a warning
# (scripts/android-start-crash.sh: tombstone, offset in librealm.so, the call before it, the library's constructors);
# it is not a test of afterdb. That librealm.so imports sigsetjmp and siglongjmp and not getauxval; afterdb's
# armeabi-v7a librealm.so imports getauxval and neither of the other two, and its self-check runs on the same image.
# The armeabi-v7a APKs extract their native libraries (useLegacyPackaging, see the android-build job); the other
# APKs are built as the app is.
on:
  pull_request:
    paths:
      - .github/workflows/upgrade.yml
      # the example app (A and B are built from it), except its README
      - example/**
      - '!example/README.md'
      # the afterdb packages built from this commit
      - package.json
      - bridge/**
      - react/**
      # every script the jobs run
      - scripts/android-upgrade.sh
      - scripts/android-abi-check.sh
      - scripts/android-selfcheck.sh
      - scripts/android-loaded-realm.sh
      - scripts/android-start-crash.sh
      - scripts/crash-in-lib.py
      - scripts/apk-openssl.sh
      - scripts/upgrade-installed.sh
      - scripts/ios-upgrade.sh
      - scripts/read-upgrade-result.mjs
      - scripts/ci-xcode.sh
      - scripts/ci-boot-simulator.sh
  push:
    branches: [main]
    # same list as pull_request
    paths:
      - .github/workflows/upgrade.yml
      - example/**
      - '!example/README.md'
      # the afterdb packages built from this commit
      - package.json
      - bridge/**
      - react/**
      # every script the jobs run
      - scripts/android-upgrade.sh
      - scripts/android-abi-check.sh
      - scripts/android-selfcheck.sh
      - scripts/android-loaded-realm.sh
      - scripts/android-start-crash.sh
      - scripts/crash-in-lib.py
      - scripts/apk-openssl.sh
      - scripts/upgrade-installed.sh
      - scripts/ios-upgrade.sh
      - scripts/read-upgrade-result.mjs
      - scripts/ci-xcode.sh
      - scripts/ci-boot-simulator.sh
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also run the iOS upgrade test (one macOS runner)'
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: upgrade-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # the official realm package sends install analytics unless this is set
  REALM_DISABLE_ANALYTICS: '1'

jobs:
  # The afterdb packages of this commit, built as in ci.yml (job packages), without the tests
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Android NDK 27
        id: ndk
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          best=""; bestkey=0; bestrev=""
          for d in "$sdk"/ndk/27.*; do
            [ -f "$d/source.properties" ] || continue
            rev=$(sed -n 's/^Pkg\.Revision *= *//p' "$d/source.properties" | tr -d '\r')
            IFS=. read -r a b c <<<"$rev"
            key=$(( ${a:-0} * 10000000000 + ${b:-0} * 100000000 + ${c:-0} ))
            if [ "$key" -gt "$bestkey" ]; then bestkey=$key; best=$d; bestrev=$rev; fi
          done
          [ -n "$best" ] || { echo "::error::No Android NDK 27.* in $sdk/ndk"; exit 1; }
          echo "Using NDK $bestrev ($best)"
          echo "ANDROID_NDK_ROOT=$best" >> "$GITHUB_ENV"
          echo "version=$bestrev" >> "$GITHUB_OUTPUT"
      # same cache keys as ci.yml
      - name: OpenSSL cache
        uses: actions/cache@v6
        with:
          path: bridge/.cache/openssl
          key: openssl-${{ hashFiles('bridge/openssl/build-openssl.sh') }}-ndk-${{ steps.ndk.outputs.version }}
      - name: Upstream downloads cache
        uses: actions/cache@v6
        with:
          path: |
            bridge/.cache/*.tgz
            bridge/.cache/node
            react/.cache
          key: upstream-${{ hashFiles('bridge/build.mjs', 'react/build.mjs') }}
      - name: OpenSSL 3.5 LTS for Android (skipped per ABI when cached)
        run: bridge/openssl/build-openssl.sh
      - run: npm run build
      - name: Packages
        run: ls -l bridge/out/*.tgz react/out/*.tgz && sha256sum bridge/out/*.tgz react/out/*.tgz
      - name: Share the packages
        uses: actions/cache/save@v6
        with:
          path: |
            bridge/out/*.tgz
            react/out/*.tgz
          key: upgrade-packages-${{ github.sha }}

  # Release APKs of the example app, one ABI each:
  #   upgrade-x86_64.apk, upgrade-x86.apk, upgrade-armeabi-v7a.apk   upgrade mode (all three sources)
  #   selfcheck-armeabi-v7a.apk, selfcheck-x86.apk                    default entry, the self-check (afterdb only)
  android-build:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        realm: [realm-20.2.0, afterdb-commit, afterdb-npm]
    name: android-build (${{ matrix.realm }})
    env:
      REALM_SOURCE: ${{ matrix.realm }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Packages from the packages job
        if: matrix.realm == 'afterdb-commit'
        uses: actions/cache/restore@v6
        with:
          path: |
            bridge/out/*.tgz
            react/out/*.tgz
          key: upgrade-packages-${{ github.sha }}
          fail-on-cache-miss: true
      # same key as ci.yml's android job
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('example/android/**/*.gradle*', 'example/android/gradle/wrapper/gradle-wrapper.properties', 'example/package.json') }}
      - name: realm and @realm/react for ${{ matrix.realm }}
        working-directory: example
        run: |
          case "$REALM_SOURCE" in
            realm-20.2.0) realm=20.2.0; react=0.20.0 ;;
            afterdb-npm) realm=npm:@pomwik/afterdb@20.3.0; react=npm:@pomwik/afterdb-react@0.20.1 ;;
            afterdb-commit) realm=file:../bridge/out/pomwik-afterdb-20.3.0.tgz; react=file:../react/out/pomwik-afterdb-react-0.20.1.tgz ;;
            *) echo "::error::unknown source $REALM_SOURCE"; exit 1 ;;
          esac
          REALM="$realm" REACT="$react" node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.dependencies.realm = process.env.REALM;
            p.dependencies["@realm/react"] = process.env.REACT;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          grep -E '"(realm|@realm/react)"' package.json
      - name: Install the app
        working-directory: example
        run: npm install --no-audit --no-fund
      - name: Installed packages (name, version, integrity)
        working-directory: example
        run: |
          bash ../scripts/upgrade-installed.sh "$REALM_SOURCE" > writer.txt
          echo "writer: $(cat writer.txt)"
      - name: Typecheck the app
        working-directory: example
        run: npx tsc --noEmit
      - name: Release APKs, one ABI each
        working-directory: example/android
        run: |
          mkdir -p ../../apks
          cp ../writer.txt ../../apks/writer.txt
          # armeabi-v7a APKs run on an x86_64 image through ARM translation. With the default packaging (native
          # libraries kept uncompressed in the APK), React Native's SoLoader looks in base.apk!/lib/x86 in the translated
          # process and the app stops at start, before any realm code (run 42726695976: SoLoaderDSONotFoundError:
          # couldn't find DSO to load: libreactnative.so). These APKs extract their libraries (lib/arm) instead.
          cat > "$RUNNER_TEMP/extract-native-libs.gradle" <<'EOF'
          allprojects {
            plugins.withId('com.android.application') {
              android.packaging.jniLibs.useLegacyPackaging = true
            }
          }
          EOF
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          builds="upgrade:x86_64 upgrade:x86 upgrade:armeabi-v7a"
          case "$REALM_SOURCE" in afterdb-*) builds="$builds selfcheck:armeabi-v7a selfcheck:x86" ;; esac
          for b in $builds; do
            IFS=: read -r mode abi <<<"$b"
            if [ "$mode" = upgrade ]; then entry=index.upgrade.js; else entry=index.js; fi
            init=(); if [ "$abi" = armeabi-v7a ]; then init=(-I "$RUNNER_TEMP/extract-native-libs.gradle"); fi
            echo "::group::$mode $abi (ENTRY_FILE=$entry ${init[*]})"
            # --no-daemon: each build reads ENTRY_FILE from its own environment
            if ! ENTRY_FILE=$entry ./gradlew "${init[@]}" assembleRelease -PreactNativeArchitectures="$abi" --no-daemon --console=plain > "gradle-$mode-$abi.log" 2>&1; then
              grep -E '(error:|^e: |FAILURE|What went wrong|CMake Error|static\.realm\.io)' "gradle-$mode-$abi.log" | head -100 || true
              tail -80 "gradle-$mode-$abi.log"
              exit 1
            fi
            tail -3 "gradle-$mode-$abi.log"
            echo "::endgroup::"
            apk="../../apks/$mode-$abi.apk"
            cp app/build/outputs/apk/release/app-release.apk "$apk"
            echo "$apk: $("$bt/aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -o 'extractNativeLibs.*' || echo 'extractNativeLibs not set (libraries stay in the APK)')"
            # NDK that compiled librealm.so (.note.android.ident; the official package uses AGP's default NDK)
            echo "$apk: librealm.so NDK $(unzip -p "$apk" "lib/$abi/librealm.so" | strings -a | awk '/^r[0-9][0-9][a-z]?$/ && !f { print; f = 1 }')"
          done
          ls -l ../../apks
      - name: OpenSSL linked into librealm.so (3.3.1 for realm@20.2.0, 3.5.9 for afterdb), and where the official build got it
        run: |
          case "$REALM_SOURCE" in realm-20.2.0) want=3.3.1 ;; *) want=3.5.9 ;; esac
          for apk in apks/*.apk; do echo "$apk"; bash scripts/apk-openssl.sh "$apk" "$want"; done
          # the archives that the build used, with their SHA-256
          cxx=example/node_modules/realm/binding/android/.cxx
          find "$cxx" -path '*Release*' -name 'openssl*.tar.gz' -exec sha256sum {} + | sed "s|$PWD/||"
          find "$cxx" -path '*Release*' -name opensslv.h -path '*/include/openssl/*' \
            -exec grep -H 'define OPENSSL_VERSION_TEXT' {} + | sed "s|$PWD/||" | sort -u
          if [ "$REALM_SOURCE" = realm-20.2.0 ]; then
            # The official package's CMake code downloads OpenSSL at configure time from this URL (no other source).
            # Each archive the build used is compared with the same URL fetched again here.
            grep -h 'set(DEP_URL' example/node_modules/realm/prebuilds/android/armeabi-v7a/share/cmake/Realm/AcquireRealmDependency.cmake | sed 's/^ *//'
            n=0
            for tgz in $(find "$cxx" -path '*Release*' -path '*/openssl/openssl.tar.gz' | sort); do
              n=$((n + 1))
              abi=$(basename "$(dirname "$(dirname "$tgz")")")
              case "$abi" in armeabi-v7a) arch=arm ;; arm64-v8a) arch=arm64 ;; x86_64) arch=x64 ;; *) arch="$abi" ;; esac
              url="https://static.realm.io/downloads/dependencies/openssl/3.3.1/openssl-3.3.1-$arch-android.tar.gz"
              used=$(sha256sum < "$tgz" | cut -d' ' -f1)
              if ! fetched=$(curl -fsSL --retry 2 --max-time 300 "$url" | sha256sum | cut -d' ' -f1); then
                echo "::warning::$abi: could not fetch $url to compare it with the archive the build used (SHA-256 $used)"
              elif [ "$fetched" = "$used" ]; then
                echo "$abi: the archive the build used has the same bytes as $url (SHA-256 $used)"
              else
                echo "::warning::$abi: the archive the build used (SHA-256 $used) differs from $url (SHA-256 $fetched)"
              fi
            done
            [ "$n" -gt 0 ] || echo "::warning::no openssl/openssl.tar.gz in $cxx: origin not checked"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: apks-${{ matrix.realm }}
          path: apks/
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-logs-${{ matrix.realm }}
          path: example/android/gradle-*.log
          retention-days: 3

  android-run:
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # abi: the ABI of B (afterdb) and of the self-check APK; a_abi: the ABI of A (official realm@20.2.0)
        include:
          - { realm: afterdb-commit, api: 36, arch: x86_64, cores: 4, ram: 4096M, abi: x86_64, a_abi: x86_64, selfcheck: false, record: false, label: 'upgrade, x86_64, Android 16' }
          - { realm: afterdb-npm, api: 36, arch: x86_64, cores: 4, ram: 4096M, abi: x86_64, a_abi: x86_64, selfcheck: false, record: false, label: 'upgrade, x86_64, Android 16' }
          - { realm: afterdb-commit, api: 30, arch: x86_64, cores: 2, ram: '', abi: armeabi-v7a, a_abi: x86_64, selfcheck: true, record: true, label: 'armeabi-v7a, ARM translation, Android 11' }
          - { realm: afterdb-npm, api: 30, arch: x86_64, cores: 2, ram: '', abi: armeabi-v7a, a_abi: x86_64, selfcheck: true, record: true, label: 'armeabi-v7a, ARM translation, Android 11' }
          - { realm: afterdb-commit, api: 30, arch: x86, cores: 2, ram: '', abi: x86, a_abi: x86, selfcheck: true, record: false, label: 'x86, x86 image, Android 11' }
          - { realm: afterdb-npm, api: 30, arch: x86, cores: 2, ram: '', abi: x86, a_abi: x86, selfcheck: true, record: false, label: 'x86, x86 image, Android 11' }
    name: android-run (${{ matrix.label }}, ${{ matrix.realm }})
    env:
      ABI: ${{ matrix.abi }}
      A_ABI: ${{ matrix.a_abi }}
      SELFCHECK: ${{ matrix.selfcheck }}
      RECORD: ${{ matrix.record }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apks-realm-20.2.0
          path: apks-a
      - uses: actions/download-artifact@v8
        with:
          name: apks-${{ matrix.realm }}
          path: apks-b
      - name: Test script
        run: |
          ls -l apks-a apks-b
          cat > emulator-test.sh <<'EOF'
          set -euo pipefail
          # the emulator has booted: a failure from here on is never retried
          touch emulator-started
          if [ "$SELFCHECK" = true ]; then
            bash scripts/android-abi-check.sh "apks-b/selfcheck-$ABI.apk" com.afterdbexample "$ABI" out
          fi
          if [ "$RECORD" = true ]; then
            # the official realm@20.2.0 APK of this ABI, launched once: a record, not a test of afterdb
            rc=0
            bash scripts/android-start-crash.sh "apks-a/upgrade-$ABI.apk" com.afterdbexample librealm.so "out/official-$ABI" \
              "apks-b/upgrade-$ABI.apk" "apks-a/upgrade-$A_ABI.apk" || rc=$?
            case "$rc" in
              0) echo "::warning::official realm@20.2.0 $ABI APK: native crash at start on this image (recorded in the log of this step); the upgrade test uses its $A_ABI APK as A" ;;
              2) echo "::warning::official realm@20.2.0 $ABI APK: started without a crash on this image; the upgrade test could use it as A" ;;
              *) exit 1 ;;
            esac
          fi
          # A, then B over it, then A again; checks after each stage which librealm.so the process loaded
          CHECK_LOADED=1 bash scripts/android-upgrade.sh \
            "apks-a/upgrade-$A_ABI.apk" "$(cat apks-a/writer.txt)" "apks-b/upgrade-$ABI.apk" "$(cat apks-b/writer.txt)" \
            com.afterdbexample out
          EOF
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: On the emulator
        id: emu1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: ${{ matrix.arch }}
          disable-animations: true
          cores: ${{ matrix.cores }}
          ram-size: ${{ matrix.ram }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash emulator-test.sh
      # One retry, only if the emulator never booted: the test script's first line writes emulator-started. Checked
      # before the retry, since the retry writes the same file.
      - name: Emulator booted? (a failed test fails the job here, without retry)
        id: boot1
        if: steps.emu1.outcome == 'failure'
        run: |
          if [ -f emulator-started ]; then
            echo "booted=true" >> "$GITHUB_OUTPUT"
            echo "::error::the emulator booted and the test failed: no retry"
            exit 1
          fi
          echo "booted=false" >> "$GITHUB_OUTPUT"
          echo "the emulator did not boot: one retry"
      - name: On the emulator (retry, the emulator did not boot)
        if: steps.emu1.outcome == 'failure' && steps.boot1.outputs.booted == 'false'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: ${{ matrix.arch }}
          disable-animations: true
          cores: ${{ matrix.cores }}
          ram-size: ${{ matrix.ram }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash emulator-test.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-run-${{ matrix.abi }}-api${{ matrix.api }}-${{ matrix.realm }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7

  # iOS: realm@20.2.0 builds without frameworks on Xcode 26.6 (not on 26.4): newest released Xcode, no frameworks.
  # A (realm@20.2.0) is upgraded to B twice, from a fresh install each time: B built from this commit, and B from
  # the packages published on npmjs.com.
  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.ios
    needs: packages
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Xcode newest (released, not beta)
        run: bash scripts/ci-xcode.sh newest
      - name: Packages from the packages job
        uses: actions/cache/restore@v6
        with:
          path: |
            bridge/out/*.tgz
            react/out/*.tgz
          key: upgrade-packages-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Three copies of the example app (A realm@20.2.0, B afterdb from this commit, B afterdb from npm)
        run: |
          for v in realm afterdb-commit afterdb-npm; do
            mkdir "app-$v" && cp -R example/. "app-$v/"
          done
          set_realm() { # <app dir> <realm> <@realm/react>
            (cd "$1" && REALM="$2" REACT="$3" node -e '
              const fs = require("fs");
              const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
              p.dependencies.realm = process.env.REALM;
              p.dependencies["@realm/react"] = process.env.REACT;
              fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
            ' && grep -E '"(realm|@realm/react)"' package.json)
          }
          set_realm app-realm 20.2.0 0.20.0
          set_realm app-afterdb-npm npm:@pomwik/afterdb@20.3.0 npm:@pomwik/afterdb-react@0.20.1
      - name: Install the three apps
        run: |
          for v in realm afterdb-commit afterdb-npm; do
            src=$v; [ "$v" = realm ] && src=realm-20.2.0
            (cd "app-$v" && npm install --no-audit --no-fund && bash ../scripts/upgrade-installed.sh "$src" > writer.txt)
            echo "app-$v: $(cat "app-$v/writer.txt")"
          done
      - name: pod install (no frameworks)
        run: |
          for v in realm afterdb-commit afterdb-npm; do
            (cd "app-$v/ios" && bundle install && bundle exec pod install)
            grep -E '^  - RealmJS' "app-$v/ios/Podfile.lock"
          done
      - name: Boot an iPhone simulator (newest iOS runtime of the selected Xcode)
        run: bash scripts/ci-boot-simulator.sh
      - name: Simulator builds (Release, ENTRY_FILE=index.upgrade.js)
        run: |
          for v in realm afterdb-commit afterdb-npm; do
            echo "::group::app-$v"
            if ! (cd "app-$v/ios" && xcodebuild -workspace AfterdbExample.xcworkspace -scheme AfterdbExample -configuration Release \
                -destination "id=$SIM_UDID" -derivedDataPath build ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
                ENTRY_FILE=index.upgrade.js build > xcodebuild-sim.log 2>&1); then
              grep -E '(error|fatal error):|BUILD FAILED' "app-$v/ios/xcodebuild-sim.log" | head -100 || true
              tail -80 "app-$v/ios/xcodebuild-sim.log"
              exit 1
            fi
            tail -3 "app-$v/ios/xcodebuild-sim.log"
            echo "::endgroup::"
          done
      - name: Upgrade test on the simulator, B from this commit (A, then B over it, then A again)
        working-directory: app-afterdb-commit
        run: |
          app=Build/Products/Release-iphonesimulator/AfterdbExample.app
          bash ../scripts/ios-upgrade.sh "../app-realm/ios/build/$app" "$(cat ../app-realm/writer.txt)" \
            "ios/build/$app" "$(cat writer.txt)" "$GITHUB_WORKSPACE/ios-upgrade/afterdb-commit"
      - name: Upgrade test on the simulator, B from npm (A, then B over it, then A again)
        working-directory: app-afterdb-commit
        run: |
          app=Build/Products/Release-iphonesimulator/AfterdbExample.app
          bash ../scripts/ios-upgrade.sh "../app-realm/ios/build/$app" "$(cat ../app-realm/writer.txt)" \
            "../app-afterdb-npm/ios/build/$app" "$(cat ../app-afterdb-npm/writer.txt)" "$GITHUB_WORKSPACE/ios-upgrade/afterdb-npm"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-upgrade
          path: |
            ios-upgrade/
